name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - 'docs/demos/**'
      - 'install.sh'
      - 'install.ps1'
      - 'subscriptions/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'docs/demos/**'
      - 'install.sh'
      - 'install.ps1'
      - 'subscriptions/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Static export and links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dagger
        run: sh scripts/setup-dagger.sh
      - name: Validate and export documentation
        run: dagger api call ci docs export --path=apps/docs/out --progress report -v
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-static-export
          path: apps/docs/out
          retention-days: 7
