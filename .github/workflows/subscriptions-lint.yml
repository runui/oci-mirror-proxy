name: Subscription Lint

on:
  pull_request:
    paths:
      - 'subscriptions/**/*.json'
      - 'scripts/validate-subscriptions.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.oxfmtrc.json'
      - '.github/workflows/subscriptions-lint.yml'
      - '.github/workflows/subscriptions-lint-comment.yml'

permissions:
  contents: read

concurrency:
  group: subscriptions-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dagger
        run: sh scripts/setup-dagger.sh
      - name: Check formatting and Schema
        run: dagger check ci/subscriptions --progress report -v
