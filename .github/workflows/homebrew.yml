name: Homebrew

on:
  push:
    branches: [master]
    paths:
      - 'Formula/**'
      - 'scripts/update-homebrew*'
      - '.github/workflows/homebrew.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'Formula/**'
      - 'scripts/update-homebrew*'
      - '.github/workflows/homebrew.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test formula generation
        run: node --test scripts/update-homebrew.test.mjs
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Install from this checkout
        run: |
          brew tap runui/oci-mirror-proxy "$GITHUB_WORKSPACE"
          brew install runui/oci-mirror-proxy/oci-mirror-proxy
      - name: Test installed formula
        run: |
          brew test runui/oci-mirror-proxy/oci-mirror-proxy
          brew services info runui/oci-mirror-proxy/oci-mirror-proxy
          oci-mirror-proxy version
