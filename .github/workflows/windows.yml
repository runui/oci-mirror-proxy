name: Windows

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (including PowerShell installers)
        run: go test -count=1 -timeout 5m ./...
      - name: Race detector
        run: go test -race -count=1 -timeout 5m ./...
      - name: Windows service installation, update and rollback
        shell: pwsh
        run: ./scripts/test-windows-service.ps1
      - name: Build amd64 and arm64
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -o "$env:RUNNER_TEMP/oci-mirror-proxy-$arch.exe" ./cmd/oci-mirror-proxy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
