name: Windows

on:
  push:
    branches: [master]
    paths:
      - 'install.ps1'
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'internal/tests/install/*.ps1'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'install.ps1'
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'internal/tests/install/*.ps1'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  test:
    name: Windows installer regression
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (including PowerShell installers)
        env:
          REQUIRE_WINDOWS_SHELLS: '1'
          REQUIRE_WINDOWS_ADMIN_TESTS: '1'
        run: go test -count=1 -timeout 5m ./...
      - name: Race detector
        env:
          REQUIRE_WINDOWS_SHELLS: '1'
          REQUIRE_WINDOWS_ADMIN_TESTS: '1'
        run: go test -race -count=1 -timeout 5m ./...
      - name: Windows service installation, update and rollback
        shell: pwsh
        env:
          WINDOWS_SERVICE_DIAGNOSTICS: ${{ runner.temp }}/windows-service-diagnostics
        run: ./internal/tests/install/test-windows-service.ps1
      - name: Upload Windows service diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-diagnostics
          path: |
            ${{ runner.temp }}/windows-service-diagnostics
            C:/ProgramData/oci-mirror-proxy-installer
          if-no-files-found: ignore
      - name: Build amd64 and arm64
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -o "$env:RUNNER_TEMP/oci-mirror-proxy-$arch.exe" ./cmd/oci-mirror-proxy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
