name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v*[!a-zA-Z0-9._+-]*|'') echo 'Invalid release tag' >&2; exit 1 ;;
            v*) ;;
            *) echo 'Release tags must start with v' >&2; exit 1 ;;
          esac

      - name: Test
        run: go test -count=1 ./...

      - name: Build release archives
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  verify-windows:
    name: Verify Windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test Windows native process handling
        shell: pwsh
        env:
          REQUIRE_WINDOWS_SHELLS: '1'
        run: go test -count=1 -timeout 5m ./internal/tests/install

      - name: Test installation, update, and checksum rejection
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerAst = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$null)
          foreach ($name in @('Get-PersistentPath','Set-PersistentPath','Send-EnvironmentChange')) {
            $fn = $installerAst.Find({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name }, $true)
            . ([scriptblock]::Create($fn.Extent.Text))
          }
          $beforeUserPath = Get-PersistentPath 'User'
          $beforeProcessPath = $env:PATH
          $root = Join-Path $env:RUNNER_TEMP 'installer-server'
          $prefix = Join-Path $env:RUNNER_TEMP 'install with spaces'
          $assets = Join-Path $root "releases/download/$env:RELEASE_TAG"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item dist/* -Destination $assets
          $server = Start-Process python -ArgumentList @('-m', 'http.server', '18765', '--bind', '127.0.0.1', '--directory', $root) -PassThru -NoNewWindow
          try {
            $url = 'http://127.0.0.1:18765'
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest "$url/" | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Fixture server did not start.' }
            ./install.ps1 -Version $env:RELEASE_TAG -Prefix $prefix -DownloadBaseUrl $url -NoService
            $binary = Join-Path $prefix 'bin/oci-mirror-proxy.exe'
            $actual = & $binary version
            if ($LASTEXITCODE -ne 0 -or $actual -ne $env:RELEASE_TAG) { throw "Unexpected version: $actual" }
            $env:PATH = (Split-Path $binary) + [IO.Path]::PathSeparator + $env:PATH
            ./install.ps1 -Version $env:RELEASE_TAG -Update -DownloadBaseUrl $url -NoService
            $original = (Get-FileHash $binary).Hash
            $checksums = Join-Path $assets 'SHA256SUMS'
            (Get-Content $checksums) -replace '^[a-fA-F0-9]{64}', ('0' * 64) | Set-Content $checksums
            $rejected = $false
            try {
              ./install.ps1 -Version $env:RELEASE_TAG -Update -DownloadBaseUrl $url -NoService
            } catch {
              if ($_.Exception.Message -notmatch 'SHA256 verification failed') { throw }
              $rejected = $true
            }
            if (-not $rejected -or (Get-FileHash $binary).Hash -ne $original) { throw 'Checksum failure replaced the installed executable.' }
          } finally {
            $env:PATH = $beforeProcessPath
            $currentPath = Get-PersistentPath 'User'
            $cleanPath = ($currentPath -split ';' | Where-Object { $_ -ine (Join-Path $prefix 'bin') }) -join ';'
            if ($cleanPath -cne $currentPath) {
              if ($cleanPath -ceq ($beforeUserPath + '').TrimEnd(';')) { $cleanPath = $beforeUserPath }
              Set-PersistentPath $cleanPath 'User'
              Send-EnvironmentChange
            }
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            foreach ($path in @($prefix,$root)) {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            }
          }

  publish:
    name: Publish GitHub release
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          (cd dist && sha256sum --check SHA256SUMS)
          prerelease=false
          case "$RELEASE_TAG" in *-*) prerelease=true ;; esac
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes --prerelease="$prerelease"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
