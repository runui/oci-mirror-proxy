name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Dagger
        run: sh scripts/setup-dagger.sh

      - name: Test and build verified release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dagger api call ci release-build --tag="$RELEASE_TAG" export --path=dist --progress report -v

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dagger
        run: sh scripts/setup-dagger.sh
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish verified release
        env:
          RELEASE_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call ci publish-release --assets=dist --provider=github --repository="$REPOSITORY" --tag="$RELEASE_TAG" --token=env://RELEASE_TOKEN --run-id="$RUN_ID" --progress report

  homebrew:
    name: Notify Homebrew tap
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dagger
        run: sh scripts/setup-dagger.sh
      - name: Request package update
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call ci notify-homebrew --tag="$RELEASE_TAG" --token=env://HOMEBREW_TOKEN --run-id="$RUN_ID" --progress report
