name: Container

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  container:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dagger
        run: sh scripts/setup-dagger.sh
      - name: Test and build pull request images
        if: github.event_name != 'push'
        run: dagger api call ci container-check --progress report -v
      - name: Test, build and publish images
        if: github.event_name == 'push'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: dagger api call ci container-publish --server="$SERVER_URL" --repository="$REPOSITORY" --ref="$REF" --username="$REGISTRY_USERNAME" --password=env://REGISTRY_PASSWORD --progress report -v
