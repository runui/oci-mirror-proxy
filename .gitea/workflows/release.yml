name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: gitea-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.8-bookworm
    steps:
      - name: Install CI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq git nodejs

      - name: Check out source
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test
        run: go test -count=1 ./...

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v*[!a-zA-Z0-9._+-]*|'') echo 'Invalid release tag' >&2; exit 1 ;;
            v*) ;;
            *) echo 'Release tags must start with v' >&2; exit 1 ;;
          esac

      - name: Build release archives
        uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish

      - name: Publish Gitea release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          [ -n "$RELEASE_TOKEN" ] || { echo 'Set the RELEASE_TOKEN repository secret first' >&2; exit 1; }
          for platform in linux_amd64 linux_arm64 linux_armv7 linux_riscv64 darwin_amd64 darwin_arm64 freebsd_amd64 freebsd_arm64 windows_amd64 windows_arm64; do
            extension=tar.gz
            case "$platform" in windows_*) extension=zip ;; esac
            [ -s "dist/oci-mirror-proxy_${RELEASE_TAG}_${platform}.${extension}" ] || { echo "Missing release archive: $platform" >&2; exit 1; }
          done
          (cd dist && sha256sum --check SHA256SUMS)
          # Require the Windows workflow for this exact commit, not another tag
          # or a manually supplied approval for an older build.
          commit=$(git rev-parse HEAD)
          windows_verified=false
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/runui/oci-mirror-proxy/commits/$commit/check-runs?check_name=Windows%20installer%20regression&per_page=100" > dist/windows-checks.json
            conclusion=$(jq -r '[.check_runs[] | select(.app.slug == "github-actions" and .name == "Windows installer regression")] | sort_by(.id) | last | .conclusion // "pending"' dist/windows-checks.json)
            case "$conclusion" in
              success) windows_verified=true; break ;;
              pending) sleep 15 ;;
              *) echo "Windows regression check failed: $conclusion" >&2; exit 1 ;;
            esac
          done
          [ "$windows_verified" = true ] || { echo 'Windows regression check for this commit is missing or incomplete; synchronize the GitHub mirror and retry.' >&2; exit 1; }
          api="${SERVER_URL%/}/api/v1/repos/$REPOSITORY"
          tag=$(printf '%s' "$RELEASE_TAG" | jq -sRr @uri)
          status=$(curl --silent --show-error --output dist/release.json --write-out '%{http_code}' \
            --header "Authorization: token $RELEASE_TOKEN" "$api/releases/tags/$tag")
          case "$status" in
            200)
              [ "$(jq -r '.draft' dist/release.json)" = true ] || { echo 'Refusing to replace assets on a public release; publish a new patch version.' >&2; exit 1; }
              ;;
            404)
              jq -n --arg tag "$RELEASE_TAG" \
                '{tag_name: $tag, name: $tag, body: "Linux, macOS, FreeBSD, and Windows binaries. Verify downloads with SHA256SUMS.", draft: true, prerelease: ($tag | test("-"))}' \
                > dist/release-request.json
              curl --fail-with-body --silent --show-error \
                --header "Authorization: token $RELEASE_TOKEN" \
                --header 'Content-Type: application/json' \
                --data-binary @dist/release-request.json \
                "$api/releases" > dist/release.json
              ;;
            *) echo "Could not look up release (HTTP $status)" >&2; exit 1 ;;
          esac
          release_id=$(jq -er '.id | numbers' dist/release.json)
          for asset in dist/*.tar.gz dist/*.zip dist/SHA256SUMS; do
            name=$(basename "$asset")
            # Replace only our named assets, so rerunning a release job is safe.
            curl --fail-with-body --silent --show-error \
              --header "Authorization: token $RELEASE_TOKEN" \
              "$api/releases/$release_id/assets" > dist/assets.json
            jq -r --arg name "$name" '.[] | select(.name == $name) | .id' dist/assets.json > dist/replace-ids
            while IFS= read -r asset_id; do
              curl --fail-with-body --silent --show-error --request DELETE \
                --header "Authorization: token $RELEASE_TOKEN" \
                "$api/releases/$release_id/assets/$asset_id"
            done < dist/replace-ids
            curl --fail-with-body --silent --show-error \
              --header "Authorization: token $RELEASE_TOKEN" \
              --form "attachment=@$asset" \
              "$api/releases/$release_id/assets?name=$name" > /dev/null
          done
          curl --fail-with-body --silent --show-error \
            --header "Authorization: token $RELEASE_TOKEN" \
            "$api/releases/$release_id/assets" > dist/assets.json
          mkdir -p dist/verified
          for asset in dist/*.tar.gz dist/*.zip dist/SHA256SUMS; do
            name=$(basename "$asset")
            size=$(wc -c < "$asset" | tr -d ' ')
            asset_url=$(jq -er --arg name "$name" --argjson size "$size" \
              '[.[] | select(.name == $name and .size == $size)] | if length == 1 then .[0].browser_download_url else error("Missing or duplicate attachment") end' dist/assets.json)
            case "$asset_url" in "${SERVER_URL%/}/"*) ;; *) echo 'Unexpected attachment origin' >&2; exit 1 ;; esac
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: token $RELEASE_TOKEN" \
              "$asset_url" --output "dist/verified/$name"
            cmp "$asset" "dist/verified/$name"
          done
          (cd dist/verified && sha256sum --check SHA256SUMS)
          curl --fail-with-body --silent --show-error --request PATCH \
            --header "Authorization: token $RELEASE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"draft":false}' "$api/releases/$release_id" > /dev/null
