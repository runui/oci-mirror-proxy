name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: gitea-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    env:
      # As in the container workflow, mount the runner's Docker socket.
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Dagger
        run: |
          docker info
          sh scripts/setup-dagger.sh

      - name: Test and build verified release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dagger api call ci release-build --tag="$RELEASE_TAG" export --path=dist --progress report -v

      - name: Publish Gitea release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call ci publish-release --assets=dist --provider=gitea --server="$SERVER_URL" --repository="$REPOSITORY" --tag="$RELEASE_TAG" --token=env:RELEASE_TOKEN --run-id="$RUN_ID" --progress report
